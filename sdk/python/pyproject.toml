[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leforge"
version = "0.1.0"
description = "Agent SDK for LeForge: implement Runtime Protocol v1 agents in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
autogen = ["autogen-agentchat>=0.4", "autogen-core>=0.4"]
crewai = ["crewai>=0.80"]

[tool.setuptools.packages.find]
include = ["leforge*"]
