global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: leforge
    static_configs: [{targets: ["forged:8080"]}]
  - job_name: otel-collector-spanmetrics
    static_configs: [{targets: ["otel-collector:8889"]}]
  - job_name: nats
    metrics_path: /varz
    static_configs: [{targets: []}]   # add a NATS exporter for broker metrics in production
