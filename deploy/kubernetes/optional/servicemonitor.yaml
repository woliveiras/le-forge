# Requires the Prometheus Operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: leforge-forged
spec:
  selector: {matchLabels: {app.kubernetes.io/part-of: leforge}}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: leforge
spec:
  groups:
    - name: leforge
      rules:
        - alert: LeForgeDeadLetters
          expr: increase(leforge_messages_consumed_total{outcome="dead"}[10m]) > 0
          labels: {severity: warning}
          annotations: {summary: "Messages dead-lettered on {{ $labels.graph }}/{{ $labels.node }}"}
        - alert: LeForgeTurnFailureRate
          expr: sum by (graph, node) (rate(leforge_executions_total{status="failed"}[10m])) / clamp_min(sum by (graph, node) (rate(leforge_executions_total[10m])), 1e-9) > 0.25
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "More than 25% of turns fail on {{ $labels.graph }}/{{ $labels.node }}"}
